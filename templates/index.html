<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Mes positions</title>

    <link rel="stylesheet" href="static/style.css"/>
    <link rel="icon" href="/favicon.ico"/>

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.7.0/dist/maplibre-gl.css" />
    <style>
      #map {
        height: 100%;
      }
    </style>
  </head>

  <body>
  <main class="dashboard-container">
    <div class="card">
      <img
        class="position-photo"
        src="/image/{{ upload_id }}"
        alt="Photo de la position"
      >
    </div>
      <aside class="card">
    <div id="map"></div>
  </aside>
<div class ="card">
      {{ timestamp }} :
      {{ description }}
    </div>
  </main>

  <script type="module">
    import * as maplibregl from "https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.mjs";

    // Création de la carte
    const map = new maplibregl.Map({
      container: "map",
      style: "https://demotiles.maplibre.org/globe.json",
      center: [0, 0],
      zoom: 2.5,
      minZoom: 2.5,
      maxZoom: 20,
    });

    // Récupération des positions
    async function loadMarkers() {
      // Position actuelle
      const currentPosition = [{{ longitude }}, {{ latitude }}];

      // Marker de la position actuelle
      new maplibregl.Marker({
        color: "#ff0000",
      })
        .setLngLat(currentPosition)
        .addTo(map);

      // Markers des anciennes positions
      for (const beat of {{ history_json|safe }}) {
        const position = [beat.longitude, beat.latitude];

      new maplibregl.Marker({
        color: "#888888",
      })
        .setLngLat(position)
        .addTo(map);
      }

      // Centrer la carte sur la position actuelle
      map.flyTo({
        center: currentPosition,
        zoom: 5,
      });
    }

    // Chargement initial
    loadMarkers();
  </script>
  </body>
</html>
