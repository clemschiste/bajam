<!DOCTYPE html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>bajam</title>

<link rel="stylesheet" href="static/style.css"/>
<link rel="icon" href="/favicon.ico"/>

<link
  rel="stylesheet"
  href="https://unpkg.com/maplibre-gl@^6.7.0/dist/maplibre-gl.css"
/>

<style>
  #map {
    height: 1000px;
    position: relative;
  }

  #map-style-selector {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1;
    background: white;
    padding: 8px;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
  }

  #map-style-selector select {
    padding: 5px;
  }

  .map-popup-image {
    display: block;
    width: 250px;
    max-height: 250px;
    object-fit: cover;
    margin-top: 10px;
    border-radius: 4px;
  }
</style>

  </head>

  <body>
    <div id="map">
      <div id="map-style-selector">
        <label for="map-style">Style :</label>
        <select id="map-style">
          <option value="globe">Globe</option>
          <option value="positron">Positron</option>
        </select>
      </div>
    </div>

    <p>Vous pouvez me suivre ici ne vous inquietez pas tout va bien. Possible de cliquer sur les petits marqueurs. Occupez vous de mon levain please. Bisous faites pas de bétises.

<script type="module">
  import * as maplibregl from "https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.mjs";

  const styles = {
    globe: "https://demotiles.maplibre.org/globe.json",
    positron: "https://tiles.openfreemap.org/styles/positron"
  };

  const currentPosition = [{{ longitude }}, {{ latitude }}];

  const map = new maplibregl.Map({
    container: "map",
    style: styles.globe,
    center: [-50, 0],
    zoom: 2.5,
    minZoom: 2.5,
    maxZoom: 20,
  });

  async function loadMarkers() {
    // Position actuelle
    const currentPosition = [{{ longitude }}, {{ latitude }}];

    const currentPopup = new maplibregl.Popup({ offset: 25 })
      .setHTML(`
        <h2>{{ timestamp }}</h2>

        <p>{{ description }}</p>

        <img
          class="map-popup-image"
          src="/image/{{ picture_id }}"
          alt="Photo de la position"
        >
      `);

    // Anciennes positions
    for (const beat of {{ history_json|safe }}) {
      const position = [beat.longitude, beat.latitude];

      const historyPopup = new maplibregl.Popup({ offset: 25 })
        .setHTML(`
          <h2>${beat.timestamp}</h2>

          <p>${beat.description}</p>

          ${
            beat.picture_id
              ? `
                <img
                  class="map-popup-image"
                  src="/image/${beat.picture_id}"
                  alt="Photo de la position"
                >
              `
              : ""
          }
        `);

      new maplibregl.Marker({
        color: "#888888",
      })
        .setLngLat(position)
        .setPopup(historyPopup)
        .addTo(map);
    }

    // Position actuelle
    new maplibregl.Marker({
      color: "#ff0000",
    })
      .setLngLat(currentPosition)
      .setPopup(currentPopup)
      .addTo(map);

    // Centrer sur la position actuelle
    map.flyTo({
      center: currentPosition,
      zoom: 10,
    });
  }

  // Changement de style
  const styleSelector = document.getElementById("map-style");

  styleSelector.addEventListener("change", (event) => {
    const selectedStyle = event.target.value;

    map.setStyle(styles[selectedStyle]);
  });

  // Chargement initial
  loadMarkers();
</script>

  </body>
</html>
