<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ crate::routes::paths::STATIC }}/style.css"/>
    <title>Bajam - Register</title>
</head>
<body>
    <h1>Register</h1>

    <form action="{{ crate::routes::paths::REGISTER }}" method="POST">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">Register</button>

    </form>
</body>
</html>
