<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="static/style.css"/>
    <title>Bajam - Login</title>
</head>
<body>
    <form action="/login" method="POST">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">Login</button>

    </form>

    No account ? <a href="/register" style="text-decoration:underline;">Register</a>
</body>
</html>
